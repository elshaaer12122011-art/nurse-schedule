:root{--bg:#f0f2f5;--card:#fff;--tx:#050505;--mut:#65676b;--bd:#ced0d4;--pri:#1877f2;--pri2:#166fe5;--g:#e4e6eb;--sh:0 1px 2px rgba(0,0,0,.2)}

:root{--io:#1f86d6;--iof:#12a05c}
