:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mut:#667;--bd:#d5d9df;--pri:#0f6fbf;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171b;--card:#1e2328;--tx:#e8eaed;--mut:#9aa;--bd:#38404a;--pri:#4aa3f0}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,"Segoe UI",Tahoma,Arial,sans-serif;padding:12px}
h1{font-size:20px;margin:0}h2{font-size:15px;margin:0 0 8px;color:var(--pri)}
.top{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:10px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
label{font-size:12px;color:var(--mut);display:block}
input,select,textarea,button{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:7px;padding:6px 8px;max-width:100%}
input,select{width:100%}textarea{width:100%;min-height:90px}
button{cursor:pointer;width:auto}button.p{background:var(--pri);color:#fff;border-color:var(--pri);font-weight:600}
.row{display:flex;gap:6px;margin-bottom:6px}.row>*{flex:1;min-width:0}.row button{flex:0 0 auto}
.hint{font-size:12px;color:var(--mut);margin:4px 0}
#warn{color:#c0392b;font-size:13px;margin-top:6px}#warn .inf{color:var(--mut)}#warn .okk{color:#1e8449}
.sm{font-size:12px;margin-top:6px}.sm b{display:block;margin-bottom:2px}.sm .u{color:#c0392b}
details{margin-top:6px;font-size:13px}summary{cursor:pointer;color:var(--pri)}details ul{margin:4px 0;padding-inline-start:18px}
.wrap{overflow-x:auto;direction:ltr;border:1px solid var(--bd);border-radius:8px;background:#fff}
table{border-collapse:collapse;font-size:12px;color:#111}
th,td{border:1px solid #bbb;padding:2px 4px;text-align:center;min-width:26px;white-space:nowrap}
th{background:#e9edf2}td.nm{text-align:left;font-weight:600;position:sticky;left:0;min-width:150px;z-index:1}
td.c{cursor:pointer}.D{background:#fff3b0}.N{background:#26397a;color:#fff}.AL{background:#9be0a8}.OFF{background:#fff}
.tot{background:#eef;font-weight:700}.we{background:#f6d6d6}.bad{background:#f5a5a5;font-weight:700}.ocr{background:#fde9c9;font-weight:700}
@media print{body{padding:0;background:#fff}.card,.noprint{display:none}.wrap{border:0;overflow:visible}@page{size:landscape;margin:6mm}table{font-size:8px}}

<textarea id="names" style="min-height:140px;direction:ltr"></textarea>
<div class="row" style="margin-top:6px"><input type="file" id="file" accept=".csv,.txt,.xlsx,.xls"><label style="flex:0 0 auto;align-self:center"><input type="checkbox" id="showid" style="width:auto" onchange="render()"> <span data-i="show_id"></span></label></div>
<div class="hint" data-i="h_names_hint"></div></div>

<div class="card noprint"><h2 data-i="h_al"></h2><div id="al"></div><button onclick="add('al')" data-i="add"></button><div class="hint" data-i="h_al_hint"></div></div>
<div class="card noprint"><h2 data-i="h_wish"></h2><textarea id="wishtxt" style="min-height:130px" data-p="ph_wish"></textarea><div class="hint" data-i="h_wish_hint"></div></div>

<div class="hint" data-i="h_rec_hint"></div>
<details><summary data-i="ex_title"></summary><ul id="exlist"></ul></details>
<div id="rsum" class="sm"></div></div>
<div class="card noprint"><button class="p" onclick="gen()" data-i="b_gen"></button> <button onclick="xl()">⬇ Excel</button> <button onclick="window.print()" data-i="b_print"></button> <button onclick="cp()" data-i="b_copy"></button>

function applyLang(){

document.querySelectorAll('[data-i]').forEach(e=>{e.innerHTML=t(e.dataset.i)});
document.querySelectorAll('[data-p]').forEach(e=>{e.placeholder=t(e.dataset.p)});
$('ttl').textContent=t('ttl');
$('exlist').innerHTML=TX[LANG].ex.map(x=>'<li>'+x+'</li>').join('');
['cnt','al'].forEach(draw);showMsgs();render()}
function toggleLang(){LANG=LANG=='ar'?'en':'ar';try{localStorage.setItem('nsl_lang',LANG)}catch(e){}applyLang()}

if(p.only=='N'){a=T;b=0}else if(p.only=='D'){a=0;b=T}else if(p.ncnt!=null){a=Math.min(p.ncnt,T);b=T-a}else if(p.dcnt!=null){b=Math.min(p.dcnt,T);a=T-b}else{a=Math.round(T*fN);b=T-a}
if(p.ncap!=null&&a>p.ncap){b+=a-p.ncap;a=p.ncap;if(p.only=='N'){b=0;T=a}}
tot[i]=T;nt[i]=a;dt[i]=b});
const lim=Array(N).fill(5),nD=Array(N).fill(0),nN=Array(N).fill(0),st=Array.from({length:N},(_,i)=>i%P[i].mxc),ns=Array(N).fill(0),prev=Array(N).fill(''),of=Array(N).fill(0),lastN=Array(N).fill(-99);
R=nurses.map(()=>Array(days).fill(''));
for(let d=0;d<days;d++){
const a=nurses.map((_,i)=>req[i][d]||'');
nurses.forEach((_,i)=>{if(st[i]==0||d==0)lim[i]=1+Math.floor(Math.random()*P[i].mxc)});
const cnt=s=>a.filter(x=>x==s).length;
const dR_=dRA[d],nR_=nRA[d];
const pick=i=>{const p=P[i];if(p.only)return p.only;if(PREF[i][d])return PREF[i][d];const nn=nR_-cnt('N'),dd=dR_-cnt('D');return nn>dd?'N':nn<dd?'D':((nt[i]-nN[i])>(dt[i]-nD[i])?'N':'D')};
nurses.forEach((n,i)=>{if(a[i]===''&&st[i]<P[i].mxc&&(of[i]>=P[i].mxo||FW[i][d])){const s=pick(i);if(!(s=='D'&&prev[i]=='N'))a[i]=s}});
for(const s of['N','D']){
let need=(s=='N'?nR_:dR_)-cnt(s);
for(let pass=0;pass<3&&need>0;pass++){
const c=[];nurses.forEach((n,i)=>{if(a[i]!=='')return;const p=P[i];if(s=='D'&&prev[i]=='N')return;
if(p.only&&p.only!==s)return;if(PREF[i][d]&&PREF[i][d]!==s)return;
const g=d-lastN[i];if(p.ran&&g>=1&&g<=p.ran&&(s!='N'||g>=2))return;
if(s=='N'&&prev[i]=='N'&&ns[i]>=p.mxn)return;
const done=nD[i]+nN[i],left=tot[i]-done,tn=s=='N'?nt[i]-nN[i]:dt[i]-nD[i];
if(pass<2&&left<=0)return;if(pass<1&&tn<=0)return;if(st[i]>=p.mxc)return;
let sc=Math.max(tn,0)*10+left/(days-d)*100+Math.random()*3+(of[i]>=p.mxo?400:0)+(FW[i][d]?900:0);
if(PREF[i][d]==s)sc+=120;if(st[i]>=lim[i])sc-=250;else{if(s=='N'&&prev[i]=='N'&&ns[i]<3)sc+=500;if(s=='D'&&prev[i]=='D')sc+=40}
c.push([sc,i])});
c.sort((x,y)=>y[0]-x[0]);for(const[,i]of c){if(need<=0)break;a[i]=s;need--}}}
nurses.forEach((_,i)=>{const s=a[i];R[i][d]=s;if(s=='D'){nD[i]++;st[i]++;ns[i]=0}else if(s=='N'){nN[i]++;st[i]++;ns[i]=prev[i]=='N'?ns[i]+1:1;lastN[i]=d}else{st[i]=0;ns[i]=0}of[i]=(s=='D'||s=='N')?0:of[i]+1;prev[i]=s})}
repairR(req);
const warn=[];
for(let d=0;d<days;d++){const cd=R.filter(r=>r[d]=='D').length,cn=R.filter(r=>r[d]=='N').length;
if(cd<dRA[d])warn.push(['w_short_d',d+1,dRA[d]-cd]);if(cn<nRA[d])warn.push(['w_short_n',d+1,nRA[d]-cn]);
const od=OC.filter((r,i)=>r[d]&&R[i][d]=='D').length,on=OC.filter((r,i)=>r[d]&&R[i][d]=='N').length;
if(od<docA[d]&&cd>=1)warn.push(['oc_short_d',d+1,docA[d]-od]);if(on<nocA[d]&&cn>=1)warn.push(['oc_short_n',d+1,nocA[d]-on])}
nurses.forEach((n,i)=>{const p=P[i];let w=0,o=0,mw=0,mo=0;R[i].forEach(s=>{if(s=='D'||s=='N'){w++;o=0}else{o++;w=0}mw=Math.max(mw,w);mo=Math.max(mo,o)});if(mw>p.mxc)warn.push(['w_work',n.name,mw]);if(mo>p.mxo)warn.push(['w_off',n.name,mo])});
MSG.warn=warn;MSG.ovr=ovr;MSG.ran=true;
showMsgs();render()}
/* ================= table / export ================= */
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function cnts(i){let D=0,N=0,AL=0,O=0;R[i].forEach((s,d)=>{if(s=='D')D++;else if(s=='N')N++;else if(s=='AL')AL++;if(OC[i]&&OC[i][d]&&(s=='D'||s=='N'))O++});return{D,N,AL,O,T:D+N}}
function dayStats(d){return{D:R.filter(r=>r[d]=='D').length,N:R.filter(r=>r[d]=='N').length,OD:OC.filter((r,i)=>r[d]&&R[i][d]=='D').length,ON:OC.filter((r,i)=>r[d]&&R[i][d]=='N').length}}
function render(){if(!R.length||!nurses.length)return;const sid=$('showid').checked;
let h='<tr><th rowspan=2>'+t('c_staff')+'</th>';if(sid)h+='<th rowspan=2>ID</th>';
for(let d=0;d<days;d++){const w=new Date(Y,M-1,d+1).getDay();h+=`<th class="${w==5?'we':''}">${d+1}</th>`}
h+=`<th class="tot" rowspan=2>${t('c_total')}</th><th class="tot" rowspan=2>${t('c_day')}</th><th class="tot" rowspan=2>${t('c_night')}</th><th class="tot" rowspan=2>OC</th><th class="tot" rowspan=2>AL</th></tr><tr>`;
for(let d=0;d<days;d++){const w=new Date(Y,M-1,d+1).getDay();h+=`<th class="${w==5?'we':''}">${DOW[w]}</th>`}h+='</tr>';
nurses.forEach((n,i)=>{const c=cnts(i);h+=`<tr><td class="nm" style="background:hsl(${(i*137.5)%360},70%,80%)">${i+1}. ${n.name}</td>`;if(sid)h+=`<td>${n.id}</td>`;
R[i].forEach((s,d)=>{h+=`<td class="c ${s||'OFF'}" onclick="tg(${i},${d})">${s}${OC[i]&&OC[i][d]&&(s=='D'||s=='N')?'·OC':''}</td>`});
h+=`<td class="tot">${c.T}</td><td class="tot">${c.D}</td><td class="tot">${c.N}</td><td class="tot">${c.O}</td><td class="tot">${c.AL}</td></tr>`});
const rows=[['D',t('r_day'),dRA,'D'],['N',t('r_night'),nRA,'N'],['OD',t('r_dayoc'),docA,'OD'],['ON',t('r_nightoc'),nocA,'ON']];
const stats=Array.from({length:days},(_,d)=>dayStats(d));
rows.forEach(([k,lab,arr])=>{const isOc=k=='OD'||k=='ON';h+=`<tr><td class="nm" style="background:${isOc?'#fde9c9':'#eee'}">${lab} (${t('req')} ${arr[0]})</td>${sid?'<td></td>':''}`;
for(let d=0;d<days;d++){const n=stats[d][k];h+=`<td class="${n<arr[d]?'bad':isOc?'ocr':'tot'}">${n}</td>`}h+='<td colspan=5></td></tr>'});
$('tb').innerHTML=h}
function tg(i,d){const s=R[i][d];if(s=='AL')return;R[i][d]=s==''?'D':s=='D'?'N':'';render()}
function aoa(){const sid=$('showid').checked;const t0=[[t('c_staff'),...(sid?['ID']:[]),...Array.from({length:days},(_,d)=>d+1),t('c_total'),'D','N','OC','AL']];
nurses.forEach((n,i)=>{const c=cnts(i);t0.push([n.name,...(sid?[n.id]:[]),...R[i].map((s,d)=>s+(OC[i]&&OC[i][d]&&(s=='D'||s=='N')?'·OC':'')),c.T,c.D,c.N,c.O,c.AL])});
const stats=Array.from({length:days},(_,d)=>dayStats(d));
[['D',t('r_day')],['N',t('r_night')],['OD',t('r_dayoc')],['ON',t('r_nightoc')]].forEach(([k,lab])=>t0.push([lab,...(sid?['']:[]),...stats.map(s=>s[k])]));
